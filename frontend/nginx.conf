# Les pages (/panier, /commandes, /admin) sont gérées par React dans le navigateur,
# pas par des fichiers sur le serveur. Si on recharge une de ces pages, nginx ne
# trouve aucun fichier à ce chemin : on lui dit de renvoyer index.html à la place.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
